<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>CIN CIN BREWERY | BEER MENU</title>

<style>

:root {
  --bg: #11110f;
  --card: #20201c;
  --text: #f4f0e6;
  --muted: #aaa69b;
  --accent: #d8a94e;
  --border: rgba(255,255,255,.12);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  flex-direction: column;
  padding: 2.5vh 3vw;
}


/* HEADER */

header {
  height: 12%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2vh;
  flex-shrink: 0;
}

.logo {
  font-size: 2.8vw;
  font-weight: 800;
  letter-spacing: .12em;
}

.logo span {
  color: var(--accent);
}

.header-right {
  text-align: right;
}

.header-right .location {
  font-size: 1vw;
  color: var(--muted);
  letter-spacing: .15em;
}

.header-right .altitude {
  font-size: 1.2vw;
  color: var(--accent);
  margin-top: .5vh;
}


/* TITLE */

.title-area {
  display: flex;
  justify-content: space-between;
  align-items: end;
  margin-bottom: 2vh;
  flex-shrink: 0;
}

.title-area h1 {
  font-size: 2.4vw;
  margin: 0;
  letter-spacing: .12em;
}

.title-area p {
  color: var(--muted);
  font-size: 1vw;
  margin: 0;
}


/* GRID */

#beer-grid {

  flex: 1;

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  grid-template-rows: repeat(2, minmax(0, 1fr));

  gap: 1.3vw;

  min-height: 0;

}


/* CARD */

.beer-card {

  background: var(--card);

  border: 1px solid var(--border);

  border-radius: 12px;

  overflow: hidden;

  display: flex;

  flex-direction: column;

  min-height: 0;

}


/* IMAGE */

.beer-image {

  width: 100%;

  height: 52%;

  background: #30302b;

  overflow: hidden;

  flex-shrink: 0;

}

.beer-image img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

}

.no-image {

  width: 100%;

  height: 100%;

  display: flex;

  justify-content: center;

  align-items: center;

  color: #777;

  font-size: 1.2vw;

  letter-spacing: .15em;

}


/* INFO */

.beer-info {

  padding: 1.2vh 1vw;

  display: flex;

  flex-direction: column;

  flex: 1;

  min-height: 0;

}

.beer-name {

  font-size: 1.45vw;

  font-weight: 800;

  line-height: 1.15;

  margin-bottom: .6vh;

}

.beer-style {

  color: var(--muted);

  font-size: .95vw;

}

.beer-abv {

  color: var(--accent);

  font-size: 1vw;

  margin-top: .5vh;

  font-weight: 700;

}


/* PRICES */

.beer-prices {

  margin-top: auto;

  padding-top: 1vh;

  border-top: 1px solid var(--border);

  display: flex;

  justify-content: space-between;

  gap: .5vw;

}

.price-block {

  display: flex;

  flex-direction: column;

  gap: .4vh;

}

.price-size {

  font-size: .8vw;

  color: var(--muted);

}

.price-value {

  font-size: 1.25vw;

  font-weight: 800;

}


/* FOOTER */

footer {

  height: 6%;

  display: flex;

  align-items: center;

  justify-content: space-between;

  color: var(--muted);

  font-size: .9vw;

  border-top: 1px solid var(--border);

  margin-top: 2vh;

  flex-shrink: 0;

}

footer span {
  color: var(--accent);
}


/* MESSAGE */

#message {

  position: absolute;

  inset: 0;

  display: flex;

  justify-content: center;

  align-items: center;

  background: var(--bg);

  font-size: 1.5vw;

  color: var(--muted);

  z-index: 10;

  text-align: center;

  padding: 3vw;

}

.hidden {
  display: none !important;
}

</style>

</head>


<body>


<div id="message">
  Loading CIN CIN BEER MENU...
</div>


<header>

  <div class="logo">
    CIN CIN <span>BREWERY</span>
  </div>

  <div class="header-right">

    <div class="location">
      YAMANAKAKO · YAMANASHI · JAPAN
    </div>

    <div class="altitude">
      MT. FUJI SPRING WATER · 1001M
    </div>

  </div>

</header>


<div class="title-area">

  <h1>OUR BEER</h1>

  <p>FRESHLY BREWED AT CIN CIN BREWERY</p>

</div>


<main id="beer-grid"></main>


<footer>

  <div>
    BREWED WITH <span>MT. FUJI SPRING WATER</span>
  </div>

  <div>
    CIN CIN BREWERY & TAPROOM
  </div>

</footer>


<script>


/**************************************************
 * API URL
 **************************************************/

const MENU_API_URL =
'https://script.google.com/macros/s/AKfycbwyGhRRthBAfF0cXk0AdpOVi1cZ5a7udWbnA9NNBlzIzQt4eCz2CG35i3GuhbkJT7Y/exec';


/**************************************************
 * REFRESH SETTINGS
 **************************************************/

const REFRESH_INTERVAL = 60 * 1000;


/**************************************************
 * LOAD MENU
 **************************************************/

async function loadMenu() {

  const message =
    document.getElementById('message');

  try {

    const response = await fetch(
      MENU_API_URL + '?t=' + Date.now()
    );

    if (!response.ok) {
      throw new Error('API connection failed');
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(
        data.error || 'Menu loading failed'
      );
    }

    renderMenu(data.items || []);

    message.classList.add('hidden');

  } catch (error) {

    console.error(error);

    message.textContent =
      'Unable to load menu. Please check connection.';

  }

}


/**************************************************
 * RENDER MENU
 **************************************************/

function renderMenu(items) {

  const grid =
    document.getElementById('beer-grid');

  grid.innerHTML = '';


  if (!items.length) {

    grid.innerHTML =
      '<div>No beer items available.</div>';

    return;

  }


  items.forEach(function(item) {

    const card =
      document.createElement('div');

    card.className = 'beer-card';


    /******** IMAGE ********/

    const imageArea =
      document.createElement('div');

    imageArea.className = 'beer-image';


    if (item.imageUrl) {

      const img =
        document.createElement('img');

      img.src = item.imageUrl;

      img.alt = item.name;

      img.loading = 'eager';

      img.onerror = function() {

        imageArea.innerHTML =
          '<div class="no-image">CIN CIN BREWERY</div>';

      };

      imageArea.appendChild(img);

    } else {

      imageArea.innerHTML =
        '<div class="no-image">CIN CIN BREWERY</div>';

    }


    /******** INFORMATION ********/

    const info =
      document.createElement('div');

    info.className = 'beer-info';


    const name =
      document.createElement('div');

    name.className = 'beer-name';

    name.textContent = item.name;


    const style =
      document.createElement('div');

    style.className = 'beer-style';

    style.textContent = item.style || '';


    const abv =
      document.createElement('div');

    abv.className = 'beer-abv';

    abv.textContent = item.abv
      ? 'ABV ' + item.abv
      : '';


    /******** PRICES ********/

    const prices =
      document.createElement('div');

    prices.className = 'beer-prices';


    if (item.size1Price) {

      prices.appendChild(
        createPriceBlock(
          item.size1,
          item.size1Price
        )
      );

    }


    if (item.size2Price && item.size2) {

      prices.appendChild(
        createPriceBlock(
          item.size2,
          item.size2Price
        )
      );

    }


    info.appendChild(name);

    info.appendChild(style);

    info.appendChild(abv);

    info.appendChild(prices);


    card.appendChild(imageArea);

    card.appendChild(info);

    grid.appendChild(card);

  });

}


/**************************************************
 * PRICE BLOCK
 **************************************************/

function createPriceBlock(size, price) {

  const block =
    document.createElement('div');

  block.className = 'price-block';


  const sizeElement =
    document.createElement('div');

  sizeElement.className = 'price-size';

  sizeElement.textContent = size || '';


  const priceElement =
    document.createElement('div');

  priceElement.className = 'price-value';

  priceElement.textContent = price;


  block.appendChild(sizeElement);

  block.appendChild(priceElement);


  return block;

}


/**************************************************
 * AUTO REFRESH
 **************************************************/

loadMenu();


setInterval(
  loadMenu,
  REFRESH_INTERVAL
);


/**************************************************
 * RELOAD WHEN TV RETURNS
 **************************************************/

document.addEventListener(
  'visibilitychange',
  function() {

    if (!document.hidden) {
      loadMenu();
    }

  }

);


</script>


</body>

</html>
